name: gas-export-pipeline-agent
description: Performs preliminary gas-export pipeline screening by chaining line velocity, pressure drop, and export compression power checks.
required_skills:
- neqsim-line-velocity-check
- neqsim-pressure-drop-screening
- neqsim-compressor-power-screening
context_skills:
- neqsim-norwegian-continental-shelf-data
supported_domains:
- process
- flow-assurance
- pipeline
- screening
inputs:
- gas_flow_rate
- gas_density_or_molecular_weight
- pipeline_internal_diameter
- pipeline_length
- pipeline_roughness
- inlet_pressure
- export_pressure
- gas_temperature
- compression_efficiency
- export_asset_and_time_window
- saved_gassco_umm_export
outputs:
- line_velocity_screening
- pressure_drop_screening
- export_compression_power_estimate
- gas_export_availability_window
- missing_information
- recommended_follow_up_analysis
- assumptions_and_limitations
- validation_checklist
agent_type: community-agent
human_review_required: true
version: 0.2.0
