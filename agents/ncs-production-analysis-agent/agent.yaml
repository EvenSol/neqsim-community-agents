name: ncs-production-analysis-agent
description: Coordinates public Norwegian Continental Shelf (NCS) production analysis by combining a source-attributed NCS reference-facts database, live Sodir DataService host-field context (monthly rates, GOR/water-cut trends, ullage proxy, nearby discoveries), and Gassco UMM export-availability events with reservoir-depletion, asset-value, and energy-emissions screening to frame production, tie-in host, export-availability, resource-accounting, and field-inventory studies before a validated NeqSim reservoir/process/economics workflow.
required_skills:
- neqsim-norwegian-continental-shelf-data
- neqsim-reservoir-depletion-screening
- neqsim-asset-value-npv-screening
- neqsim-energy-emissions-screening
supported_domains:
- field-development
- reservoir-engineering
- production-analysis
- open-data
- economics
- tie-in-screening
- gas-export
inputs:
- ncs_facts_or_inventory_question
- field_inventory_filters
- official_yearly_production_csv_export
- host_field_name_and_search_radius
- saved_gassco_umm_export
- export_asset_and_time_window
- reservoir_fluid_type_and_recoverable_volume
- initial_and_abandonment_pressure
- offtake_rate_and_field_life_years
- price_discount_rate_and_energy_use_assumptions
- analysis_objective
outputs:
- source_attributed_national_kpis
- resource_accounting_split_and_rp_horizon
- field_inventory_counts_and_aggregations
- per_field_reserves_ranked_and_by_area
- annual_production_trend_and_product_share
- host_monthly_rates_gor_and_water_cut_trend
- host_historic_peak_ullage_proxy
- nearby_tie_in_discovery_candidates
- gas_export_availability_window
- screening_reservoir_depletion_profile
- asset_value_and_emissions_screening
- recommended_neqsim_workflows
- required_follow_up_studies
- validation_checklist
agent_type: community-coordinator
coordinated_agents:
- reservoir-to-facility-screening-agent
- concept-selection-agent
- asset-economics-agent
- tie-in-screening-agent
- gas-export-pipeline-agent
human_review_required: true
version: 0.2.0
