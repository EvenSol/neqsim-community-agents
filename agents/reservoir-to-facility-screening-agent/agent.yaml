name: reservoir-to-facility-screening-agent
agent_type: community-coordinator
description: Screens reservoir depletion, well inflow, SURF manifold routing and flowline/riser arrival pressure
  over time; routes natural-language full-chain Python or Java NeqSim requests through reservoir, wells, multiphase
  hydraulics, facilities, process utilities and downstream processing using existing core/community specialists.
required_skills:
- neqsim-reservoir-depletion-screening
- neqsim-production-network-routing
- neqsim-subsea-layout-geometry
- neqsim-step-out-screening
- neqsim-reservoir-facility-value-chain
- neqsim-ageing-life-extension-screening
coordinated_agents:
- subsea-layout-screening-agent
- tie-in-screening-agent
supported_domains:
- field-development
- reservoir-engineering
- production-technology
- subsea-layout
- flow-assurance
inputs:
- reservoir_fluid_type_and_recoverable_volume
- initial_and_abandonment_pressure
- offtake_rate_and_field_life_years
- water_cut_and_gor_trends
- well_list_with_productivity_index_and_tubing_head_pressure
- manifold_and_flowline_riser_layout
- host_name_and_required_arrival_pressure
- target_facility_inlet_or_separator_pressure
- screening_objective
outputs:
- reservoir_pressure_and_production_profile_vs_time
- well_inflow_rates_and_warnings
- manifold_aggregated_rates
- platform_arrival_pressure_rollup_and_margin
- pressure_regulated_per_well_rates_from_inlet_pressure
- time_development_summary
- recommended_neqsim_workflows
- required_follow_up_studies
- validation_checklist
human_review_required: true
version: 0.2.1
context_skills:
- neqsim-production-system-modeling
- neqsim-integrated-production-and-lifecycle
- neqsim-process-modeling
- neqsim-utility-design
- neqsim-lng-liquefaction
- neqsim-acid-gas-treating
