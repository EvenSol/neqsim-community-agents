- reporting
- process-engineering
- flow-assurance
- piping-and-layout
- cfd-post-processing
inputs:
- vessel_dimensions_levels_nozzles_and_internals
- pipeline_profile_and_calculated_fields
- equipment_positions_sizes_and_utilisation
- pipe_routes_diameters_valves_and_stream_values
- neqsim_separator_or_pipeline_object
